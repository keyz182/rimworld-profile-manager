[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.5.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["Kieran David Evans"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
strip = true

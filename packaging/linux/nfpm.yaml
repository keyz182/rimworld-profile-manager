# deb and rpm packages of the Linux release bundle. Run through scripts/deb-rpm.sh, which
# stages the bundle, sets VERSION and runs nfpm from the staged folder (src paths are
# relative to it). The layout matches the AUR packages: the app lives in /opt/rwpm because
# it finds payload/ and doorstop/ beside its own file, and /usr/bin/rwpm links to it.
name: rwpm
arch: amd64
platform: linux
version: ${VERSION}
version_schema: none
release: 1
section: utils
priority: optional
maintainer: Kieran David Evans <keyz182@gmail.com>
description: |-
  Separate RimWorld profiles, each with its own saves, settings and mod list
  RimWorld Profile Manager keeps more than one RimWorld setup on one computer.
  Playing one profile never changes another.
vendor: keyz182
homepage: https://github.com/keyz182/rimworld-profile-manager
license: MIT

# The binary loads the window libraries at run time, so the linker does not list them.
# They are weak dependencies: a missing one leaves the app without a window, but the
# package still installs. glibc 2.28 is the floor the release build is checked against.
overrides:
  deb:
    depends:
      - libc6 (>= 2.28)
      - libgcc-s1 | libgcc1
    recommends:
      - libvulkan1
      - libxkbcommon0
      - libwayland-client0
      - libx11-6
      - libxcursor1
      - libxi6
      - libxcb1
      - libdbus-1-3
  rpm:
    depends:
      - glibc >= 2.28
      - libgcc
    recommends:
      - vulkan-loader
      - libxkbcommon
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libxcb
      - dbus-libs

contents:
  # Own the folders too, or rpm leaves them behind when the package is removed.
  - dst: /opt/rwpm
    type: dir
    file_info: {mode: 0755}
  - dst: /opt/rwpm/doorstop
    type: dir
    file_info: {mode: 0755}
  - dst: /opt/rwpm/payload
    type: dir
    file_info: {mode: 0755}
  - dst: /usr/share/licenses/rwpm
    type: dir
    file_info: {mode: 0755}
    packager: rpm
  - src: ./rwpm
    dst: /opt/rwpm/rwpm
    file_info: {mode: 0755}
  - src: ./rwpm-steam
    dst: /opt/rwpm/rwpm-steam
    file_info: {mode: 0755}
  - src: ./libsteam_api.so
    dst: /opt/rwpm/libsteam_api.so
    file_info: {mode: 0644}
  - src: ./doorstop/libdoorstop.so
    dst: /opt/rwpm/doorstop/libdoorstop.so
    file_info: {mode: 0644}
  - src: ./payload/Rwpm.Payload.dll
    dst: /opt/rwpm/payload/Rwpm.Payload.dll
    file_info: {mode: 0644}
  - src: ./payload/Rwpm.Payload.Hook.dll
    dst: /opt/rwpm/payload/Rwpm.Payload.Hook.dll
    file_info: {mode: 0644}
  - src: /opt/rwpm/rwpm
    dst: /usr/bin/rwpm
    type: symlink

  - src: ./rwpm.desktop
    dst: /usr/share/applications/rwpm.desktop
    file_info: {mode: 0644}
  - src: ./rwpm-mime.xml
    dst: /usr/share/mime/packages/rwpm.xml
    file_info: {mode: 0644}
  - src: ./icons/rwpm-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/rwpm.png
  - src: ./icons/rwpm-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/rwpm.png
  - src: ./icons/rwpm-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/rwpm.png
  - src: ./icons/rwpm-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/rwpm.png
  - src: ./icons/rwpm-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/rwpm.png
  - src: ./icons/rwpm-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/rwpm.png
  - src: ./icons/rwpm.svg
    dst: /usr/share/icons/hicolor/scalable/apps/rwpm.svg

  # Debian policy wants the licence in a file named `copyright`; rpm wants it under licenses.
  - src: ./LICENSE
    dst: /usr/share/doc/rwpm/copyright
    packager: deb
  - src: ./licenses/
    dst: /usr/share/doc/rwpm/third-party
    type: tree
    packager: deb
  - src: ./LICENSE
    dst: /usr/share/licenses/rwpm/LICENSE
    packager: rpm
  - src: ./licenses/
    dst: /usr/share/licenses/rwpm/third-party
    type: tree
    packager: rpm

[package]
name = "rwpm"
description = "RimWorld profile manager: GUI and launch wrapper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# `markdown`: pack descriptions. `image-without-codecs`: pack covers (PNG decoding comes from rwpm-core). Neither fetches anything from the net.
iced = { version = "0.14.0", features = ["markdown", "image-without-codecs"] }
# Local socket (Unix socket / Windows named pipe): a second launch hands its file to the open window.
interprocess = "2.4.6"
# System folder dialog for finding RimWorld (C: folder picker).
rfd = "0.17.2"
rmcp = { version = "3.6.0", features = ["server", "transport-io", "macros"] }
rwpm-core = { path = "../rwpm-core" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt", "macros", "io-std"] }

[lints]
workspace = true

[dev-dependencies]
rwpm-core = { path = "../rwpm-core", features = ["test-support"] }
iced_test = "0.14.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
ttf-parser = "0.25.1"

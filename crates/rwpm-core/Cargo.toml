[package]
name = "rwpm-core"
description = "RimWorld profile manager core logic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Lets another crate's tests build a `self_update::Staged` without downloading one.
test-support = []

[dependencies]
dirs = "7.0.0"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
reflink-copy = "0.1.30"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.0"
steamlocate = "2.1.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
toml = "1.1.8"
trash = "5.2.9"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
zstd = "0.14.2"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

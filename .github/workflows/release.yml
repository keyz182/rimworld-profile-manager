name: Release

# On every push to main: CI first; then, if any feat/fix (or breaking change) landed since the last tag,
# work out the next version, build both bundles, then push the bump commit and tag in one
# atomic push and publish a GitHub Release. Run it by hand with a tag to (re)publish an
# existing version, e.g. v1.0.0.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v1.0.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  plan:
    name: Next version
    needs: ci
    # Releases only follow a green CI run; a hand-run publish of an existing tag skips CI.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.ci.result == 'success')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.next.outputs.sha }}
      existing: ${{ steps.next.outputs.existing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: --version
      - id: next
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -n "$TAG" ]]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $TAG" >&2; exit 1; }
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "existing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # cog only bumps on a branch named in cog.toml; the checkout above is detached.
          git checkout -q -B main
          next="$(cog bump --auto --dry-run)"
          echo "existing=false" >> "$GITHUB_OUTPUT"
          if [[ "$next" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=${next#v}" >> "$GITHUB_OUTPUT"
          elif [[ "$next" == "No conventional commits"* ]]; then
            echo "No feat/fix since the last tag; nothing to release."
          else
            echo "cog bump --dry-run gave: $next" >&2
            exit 1
          fi

  build:
    name: Bundle (${{ matrix.os }})
    needs: plan
    # always(): a hand-run publish skips CI, and GitHub would skip every job after a skipped one.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        # MacOS can't be cross-compiled from Linux — codesign and the adhoc-sign
        # step need the real toolchain — so it gets its own Mac runner, unlike
        # Windows which cross-builds fine with mingw from the ubuntu runner.
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: windows
            runner: ubuntu-24.04
          - os: macos
            runner: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: System packages
        if: matrix.os == 'windows'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            zip nsis gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # Caches are keyed on the committed Cargo.lock, so they come before the version is set.
      # Only runs on main write the caches these jobs read; pull request caches stay separate.
      # A hand-run publish builds an old tag, so it neither reads nor writes these caches.
      - name: Cache the soldier toolchain, crates and build
        if: matrix.os == 'linux' && github.event_name == 'push'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/soldier-cache
            target/soldier
          key: soldier-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/package.sh') }}
          restore-keys: soldier-
      - name: Cache the Windows build
        if: matrix.os == 'windows' && github.event_name == 'push'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows
      - name: Cache the macOS build
        if: matrix.os == 'macos' && github.event_name == 'push'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-macos
      - name: Set the release version for the bundle names
        if: needs.plan.outputs.existing != 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # perl, not `sed -i`: BSD sed (macOS runner) takes -i's next arg as a
          # backup suffix and would eat the filename. -0777 slurps so the //m match
          # without /g hits only the first `version =`, i.e. [workspace.package].
          perl -0777 -i -pe 's/^version = ".*"/version = "$ENV{VERSION}"/m' Cargo.toml
          cargo update --workspace
      - run: scripts/package.sh "$OS"
        env:
          OS: ${{ matrix.os }}
      # Exact versioned paths: the Windows Rust cache restores target/, old bundles included.
      - name: Linux AppImage
        if: matrix.os == 'linux'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/appimage.sh "target/dist/rwpm-$VERSION-linux-x86_64"
      - name: Linux deb and rpm
        if: matrix.os == 'linux'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/deb-rpm.sh "target/dist/rwpm-$VERSION-linux-x86_64"
      - name: Windows installer
        if: matrix.os == 'windows'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: scripts/installer.sh "target/dist/rwpm-$VERSION-windows-x86_64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.os }}
          path: |
            target/dist/rwpm-${{ needs.plan.outputs.version }}-linux-x86_64.tar.gz
            target/dist/rwpm-${{ needs.plan.outputs.version }}-x86_64.AppImage
            target/dist/rwpm_${{ needs.plan.outputs.version }}-1_amd64.deb
            target/dist/rwpm-${{ needs.plan.outputs.version }}-1.x86_64.rpm
            target/dist/rwpm-${{ needs.plan.outputs.version }}-windows-x86_64.zip
            target/dist/rwpm-${{ needs.plan.outputs.version }}-windows-x86_64-setup.exe
            target/dist/rwpm-${{ needs.plan.outputs.version }}-macos-arm64.zip
          if-no-files-found: error

  publish:
    name: Tag and publish
    needs: [plan, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          # The bump commit and tag are pushed with this job's GITHUB_TOKEN (contents: write).
          # Pushes made with it start no new workflow runs, so a release cannot loop.
          persist-credentials: true
      - uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: --version
      - name: Bump version and changelog
        if: needs.plan.outputs.existing != 'true'
        run: |
          git checkout -q -B main  # cog bumps only on main (cog.toml)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cog bump --auto
      - name: Push the bump commit and tag together
        if: needs.plan.outputs.existing != 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          [[ "$(git describe --tags --exact-match)" == "v$VERSION" ]] || {
            echo "cog bumped to $(git describe --tags), planned v$VERSION" >&2; exit 1; }
          # Fails if main moved on since CI ran; the next CI run on main releases instead.
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v$VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cog changelog --at "v$VERSION" > notes.md 2>/dev/null || echo "Release v$VERSION" > notes.md
          gh release create "v$VERSION" dist/* --title "v$VERSION" --notes-file notes.md --verify-tag

  # Moves the two AUR packages (rwpm-bin, rwpm) to the new version. It does nothing until the
  # AUR_SSH_KEY secret exists, and a failure here never touches the release itself.
  aur:
    name: Update the AUR packages
    needs: [plan, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.plan.outputs.version }}
          persist-credentials: false
      - name: Update the packages
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if [[ -z "$AUR_SSH_KEY" ]]; then
            echo "::notice::No AUR_SSH_KEY secret, so the AUR packages were not updated."
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/aur_key"
          known="$RUNNER_TEMP/aur_known_hosts"
          printf '%s\n' "$AUR_SSH_KEY" >"$key"
          ssh-keyscan -t ed25519,ecdsa,rsa aur.archlinux.org >"$known" 2>/dev/null
          ssh-keygen -lf "$known"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$known -o StrictHostKeyChecking=yes"
          scripts/aur.sh "$VERSION" --push

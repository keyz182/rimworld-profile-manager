name: Release

# On every push to main: CI first; then, if any feat/fix (or breaking change) landed since the last tag,
# work out the next version, build both bundles, then push the bump commit and tag in one
# atomic push and publish a GitHub Release. Run it by hand with a tag to (re)publish an
# existing version, e.g. v1.0.0.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v1.0.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  plan:
    name: Next version
    needs: ci
    # Releases only follow a green CI run; a hand-run publish of an existing tag skips CI.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.ci.result == 'success')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.next.outputs.sha }}
      existing: ${{ steps.next.outputs.existing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 # v4.1.0
        with:
          command: --version
      - id: next
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -n "$TAG" ]]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $TAG" >&2; exit 1; }
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "existing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nothing to release (only chore/docs/ci… since the last tag) → empty version.
          if next="$(cog bump --auto --dry-run 2>/dev/null)"; then
            echo "version=${next#v}" >> "$GITHUB_OUTPUT"
          else
            echo "No feat/fix since the last tag; nothing to release."
          fi
          echo "existing=false" >> "$GITHUB_OUTPUT"

  build:
    name: Bundles
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev zip \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Set the release version for the bundle names
        if: needs.plan.outputs.existing != 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace
      - run: scripts/package.sh linux
      - run: scripts/package.sh windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles
          path: |
            target/dist/*.tar.gz
            target/dist/*.zip
          if-no-files-found: error

  publish:
    name: Tag and publish
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          # The bump commit and tag are pushed with this job's GITHUB_TOKEN (contents: write).
          # Pushes made with it start no new workflow runs, so a release cannot loop.
          persist-credentials: true
      - uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 # v4.1.0
        with:
          command: --version
      - name: Bump version and changelog
        if: needs.plan.outputs.existing != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cog bump --auto
      - name: Push the bump commit and tag together
        if: needs.plan.outputs.existing != 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          [[ "$(git describe --tags --exact-match)" == "v$VERSION" ]] || {
            echo "cog bumped to $(git describe --tags), planned v$VERSION" >&2; exit 1; }
          # Fails if main moved on since CI ran; the next CI run on main releases instead.
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v$VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles
          path: dist
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cog changelog --at "v$VERSION" > notes.md 2>/dev/null || echo "Release v$VERSION" > notes.md
          gh release create "v$VERSION" dist/* --title "v$VERSION" --notes-file notes.md --verify-tag
